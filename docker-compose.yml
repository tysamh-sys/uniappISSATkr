services:
  postgres:
    image: postgres:16-alpine
    container_name: uniapp-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: university_attendance
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d university_attendance"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uniapp-api
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/university_attendance?schema=public"
      JWT_SECRET: "super-secret-university-jwt-key-2026-change-in-production"
      JWT_EXPIRES_IN: "1d"
      CORS_ORIGIN: "*"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: uniapp-frontend
    restart: always
    ports:
      - "8443:8443"
    depends_on:
      - api

volumes:
  postgres_data:
